# Reverse proxy del VPS (Integrante 4 — HU-4.3 / HU-4.4).
# Unico punto de entrada publico. Ajustar server_name al dominio real.

upstream backend_api {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Health check del backend (monitoreo y verificacion de despliegue)
    location = /health {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (build estatico de Vite; se monta en el despliegue del front)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
